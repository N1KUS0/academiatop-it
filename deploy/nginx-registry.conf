server {
    listen 80;
    server_name _;

    # Запросы через туннель AmneziaWG приходят от VPS (academiatop-blg.ru).
    # Берём реальный IP посетителя из его заголовка — нужен для блокировки перебора паролей.
    set_real_ip_from 10.77.88.0/24;
    real_ip_header X-Real-IP;

    client_max_body_size 20m;   # для загрузки резервной копии

    location /static/ {
        alias /opt/registry/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
