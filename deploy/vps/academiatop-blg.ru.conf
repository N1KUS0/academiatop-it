# Зеркало «Академии ТОП» — VPS, домен academiatop-blg.ru.
# Запросы идут через туннель AmneziaWG на сервер академии.
# __ACADEMY_WG_IP__ подставляет setup-mirror.sh.

limit_req_zone $binary_remote_addr zone=registry_mirror:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=registry_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name academiatop-blg.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name academiatop-blg.ru;

    ssl_certificate     /etc/letsencrypt/live/academiatop-blg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academiatop-blg.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20m;   # загрузка резервной копии

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # Cookie входа — только по HTTPS
    proxy_cookie_flags ~ secure samesite=lax;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    error_page 502 503 504 /offline.html;

    # Страница входа — не больше 10 запросов в минуту с одного IP.
    location = /login {
        limit_req zone=registry_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://__ACADEMY_WG_IP__:80;
    }

    location / {
        limit_req zone=registry_mirror burst=30 nodelay;
        proxy_pass http://__ACADEMY_WG_IP__:80;
    }

    location = /offline.html {
        root /var/www/registry-mirror;
        internal;
    }
}
